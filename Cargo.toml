[package]
name = "anyinfer"
version = "0.5.1"
edition = "2024"
publish = false
description = "Single-host DeepSeek V4 inference and performance experiments on Ascend"
default-run = "anyinfer"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
